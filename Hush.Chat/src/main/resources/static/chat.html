<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- FIX: Enhanced viewport for mobile - prevents zoom issues and handles iOS properly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Ensure proper iOS status bar handling -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Chat Room - Hush.Chat</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/chat.css">
    <!-- Emoji Picker Web Component -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
</head>
<body>
<div class="chat-container">
    <!-- Chat Header - Compact design for mobile -->
    <header class="chat-header">
        <div class="room-info">
            <h2 id="roomName">Loading...</h2>
            <div class="room-meta">
                <span class="room-code"><strong id="roomCode">-----</strong></span>
                <span class="separator">•</span>
                <span class="user-count" id="userCount">👥 0/10</span>
            </div>
        </div>
        <button id="leaveRoomBtn" class="btn-leave">Leave</button>
    </header>

    <!-- Messages Area -->
    <main class="messages-container" id="messagesContainer">
        <div class="welcome-message">
            <span class="lock-icon">🔐</span>
            <p>Welcome to <strong id="welcomeRoomName"></strong></p>
            <p class="small-text">Messages will auto-delete after 10 minutes</p>
        </div>
    </main>

    <!-- Scroll to Bottom Button -->
    <button id="scrollToBottomBtn" class="scroll-to-bottom-btn" style="display: none;" title="Scroll to bottom">
        <span class="scroll-arrow">↓</span>
        <span id="unreadBadge" class="unread-badge" style="display: none;">0</span>
    </button>

    <!-- Message Input -->
    <footer class="message-input-container">
        <!-- FIX 8: Reply Preview Wrapper for smooth height animation (prevents scroll jump) -->
        <div id="replyPreviewWrapper" class="reply-preview-wrapper">
            <!-- Reply Preview Bar -->
            <div id="replyPreviewBar" class="reply-preview-bar">
                <div class="reply-preview-content">
                    <div class="reply-preview-indicator"></div>
                    <div class="reply-preview-info">
                        <span class="reply-preview-sender" id="replyPreviewSender"></span>
                        <span class="reply-preview-text" id="replyPreviewText"></span>
                    </div>
                    <!-- FIX 5: Type icon for reply type indicator -->
                    <span class="reply-preview-type-icon" id="replyPreviewTypeIcon"></span>
                </div>
                <button type="button" class="reply-preview-close" id="replyPreviewClose" title="Cancel reply" aria-label="Cancel reply">✕</button>
            </div>
        </div>
        
        <form id="messageForm" class="message-form">
            <div class="message-input-row">
                <button type="button" id="emojiPickerBtn" class="btn-icon" title="Emoji" aria-label="Open emoji picker">
                    😊
                </button>
                <button type="button" id="filePickerBtn" class="btn-icon" title="Attach file">
                    📎
                </button>
                <input
                        type="file"
                        id="fileInput"
                        style="display: none;"
                        accept=".jpg,.jpeg,.png,.pdf,.txt,.docx,.xlsx"
                />
                <textarea
                        id="messageInput"
                        placeholder="Message..."
                        maxlength="5000"
                        autocomplete="off"
                        rows="1"
                        required
                ></textarea>
                <button type="submit" id="sendBtn" class="btn-send" disabled aria-label="Send message" title="Send message">
                    <svg class="send-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div id="fileUploadStatus" class="file-upload-status" style="display: none;">
                <span id="fileUploadName"></span>
                <span id="fileUploadProgress"></span>
            </div>
            <!-- REMOVED: "Chatting as: Username" text - not needed per UX requirements -->
        </form>
    </footer>
</div>

<!-- Leave Room Modal (Simple) -->
<div id="leaveModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>Leave Room?</h3>
        <p>Are you sure you want to leave this chat room?</p>
        <div class="modal-actions">
            <button id="confirmLeave" class="btn btn-danger">Leave</button>
            <button id="cancelLeave" class="btn btn-secondary">Cancel</button>
        </div>
    </div>
}</div>

<!-- Image Preview Modal -->
<div id="imagePreviewModal" class="modal" style="display: none;">
    <div class="image-modal-content">
        <img id="imagePreviewImg" alt="Image preview">
    </div>
</div>

<!-- Emoji Picker Modal -->
<div id="emojiPickerModal" class="emoji-picker-modal" style="display: none;">
    <div class="emoji-picker-backdrop"></div>
    <div class="emoji-picker-container">
        <emoji-picker class="dark"></emoji-picker>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/emoji.js"></script>
<script src="js/chat.js"></script>
<!-- Polling Fallback -->
<script src="js/polling.js"></script>
<!-- WebSocket Transport -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="js/eventProcessor.js"></script>
<script src="js/webSocketAdapter.js"></script>
<script src="js/transportFactory.js"></script>
<script>
    // Check if user has joined a room
    const roomCode = localStorage.getItem('roomCode');
    const roomName = localStorage.getItem('roomName');
    const userId = localStorage.getItem('userId');
    const userName = localStorage.getItem('userName');

    if (!roomCode || !userId || !userName) {
        alert('Please create or join a room first');
        window.location.href = 'index.html';
    }

    // Display room info
    document.getElementById('roomCode').textContent = roomCode;
    document.getElementById('roomName').textContent = roomName || 'Chat Room';
    document.getElementById('welcomeRoomName').textContent = roomName || 'Chat Room';
    // REMOVED: "Chatting as: Username" display - not needed per UX requirements

    // Track if room info fetch should continue
    let roomInfoActive = true;
    let roomInfoInterval = null;

    // Fetch and display room info
    async function loadRoomInfo() {
        if (!roomInfoActive) return;
        
        try {
            const response = await api.get(`/rooms/${roomCode}/info`);
            if (response.success) {
                const info = response.data;
                document.getElementById('userCount').textContent = 
                    `👥 ${info.currentUsers}/${info.maxUsers}`;
            }
        } catch (error) {
            // Only log once, not repeatedly
            if (roomInfoActive) {
                console.error('Failed to load room info:', error);
            }
            // Check if room is closed
            if (error.message && error.message.includes('not found')) {
                // Stop future room info fetches
                roomInfoActive = false;
                if (roomInfoInterval) {
                    clearInterval(roomInfoInterval);
                    roomInfoInterval = null;
                }
                if (typeof chat !== 'undefined' && chat.handleRoomClosed) {
                    chat.handleRoomClosed();
                }
            }
        }
    }

    loadRoomInfo();
    // Refresh room info every 10 seconds
    roomInfoInterval = setInterval(loadRoomInfo, 10000);

    // Leave Room
    document.getElementById('leaveRoomBtn').addEventListener('click', () => {
        document.getElementById('leaveModal').style.display = 'flex';
    });

    document.getElementById('cancelLeave').addEventListener('click', () => {
        document.getElementById('leaveModal').style.display = 'none';
    });

    document.getElementById('confirmLeave').addEventListener('click', async () => {
        try {
            // Stop WebSocket transport first
            if (typeof transportFactory !== 'undefined') {
                transportFactory.cleanup();
            }
            
            await api.post('/rooms/leave', {
                roomCode: roomCode,
                userId: userId
            });
            
            // Clear local storage
            if (typeof chat !== 'undefined' && chat.cleanup) {
                chat.cleanup();
            } else {
                localStorage.removeItem('roomCode');
                localStorage.removeItem('roomName');
                localStorage.removeItem('userId');
                localStorage.removeItem('userName');
                localStorage.removeItem('isCreator');
                localStorage.removeItem('joinTime');
                localStorage.removeItem('lastMessageTime');
            }
            
            window.location.href = 'index.html';
        } catch (error) {
            alert('Failed to leave room: ' + error.message);
        }
    });
</script>
</body>
</html>
