<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room - Hush.Chat</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
<div class="chat-container">
    <!-- Chat Header -->
    <header class="chat-header">
        <div class="room-info">
            <h2 id="roomName">Loading...</h2>
            <div class="room-meta">
                <span class="room-code">Code: <strong id="roomCode">-----</strong></span>
                <span class="user-count" id="userCount">👥 0/10</span>
            </div>
        </div>
        <button id="leaveRoomBtn" class="btn-leave">Leave Room</button>
    </header>

    <!-- Messages Area -->
    <main class="messages-container" id="messagesContainer">
        <div class="welcome-message">
            <span class="lock-icon">🔐</span>
            <p>Welcome to <strong id="welcomeRoomName"></strong></p>
            <p class="small-text">Messages will auto-delete after 10 minutes</p>
        </div>
    </main>

    <!-- Scroll to Bottom Button -->
    <button id="scrollToBottomBtn" class="scroll-to-bottom-btn" style="display: none;" title="Scroll to bottom">
        <span class="scroll-arrow">↓</span>
        <span id="unreadBadge" class="unread-badge" style="display: none;">0</span>
    </button>

    <!-- Message Input -->
    <footer class="message-input-container">
        <form id="messageForm" class="message-form">
            <div class="message-input-row">
                <button type="button" id="filePickerBtn" class="btn-icon" title="Attach file">
                    📎
                </button>
                <input
                        type="file"
                        id="fileInput"
                        style="display: none;"
                        accept=".jpg,.jpeg,.png,.pdf,.txt,.docx,.xlsx"
                />
                <textarea
                        id="messageInput"
                        placeholder="Type your message... (Shift+Enter for new line)"
                        maxlength="5000"
                        autocomplete="off"
                        rows="1"
                        required
                ></textarea>
                <button type="submit" class="btn-send">
                    <span>Send</span>
                </button>
            </div>
            <div id="fileUploadStatus" class="file-upload-status" style="display: none;">
                <span id="fileUploadName"></span>
                <span id="fileUploadProgress"></span>
            </div>
            <div class="input-info">
                <span id="userName"></span>
            </div>
        </form>
    </footer>
</div>

<!-- Leave Room Modal (Simple) -->
<div id="leaveModal" class="modal" style="display: none;">
    <div class="modal-content">
        <h3>Leave Room?</h3>
        <p>Are you sure you want to leave this chat room?</p>
        <div class="modal-actions">
            <button id="confirmLeave" class="btn btn-danger">Leave</button>
            <button id="cancelLeave" class="btn btn-secondary">Cancel</button>
        </div>
    </div>
}</div>

<!-- Image Preview Modal -->
<div id="imagePreviewModal" class="modal" style="display: none;">
    <div class="image-modal-content">
        <img id="imagePreviewImg" alt="Image preview">
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/chat.js"></script>
<script src="js/polling.js"></script>
<script>
    // Check if user has joined a room
    const roomCode = localStorage.getItem('roomCode');
    const roomName = localStorage.getItem('roomName');
    const userId = localStorage.getItem('userId');
    const userName = localStorage.getItem('userName');

    if (!roomCode || !userId || !userName) {
        alert('Please create or join a room first');
        window.location.href = 'index.html';
    }

    // Display room info
    document.getElementById('roomCode').textContent = roomCode;
    document.getElementById('roomName').textContent = roomName || 'Chat Room';
    document.getElementById('welcomeRoomName').textContent = roomName || 'Chat Room';
    document.getElementById('userName').textContent = `Chatting as: ${userName}`;

    // Track if room info fetch should continue
    let roomInfoActive = true;
    let roomInfoInterval = null;

    // Fetch and display room info
    async function loadRoomInfo() {
        if (!roomInfoActive) return;
        
        try {
            const response = await api.get(`/rooms/${roomCode}/info`);
            if (response.success) {
                const info = response.data;
                document.getElementById('userCount').textContent = 
                    `👥 ${info.currentUsers}/${info.maxUsers}`;
            }
        } catch (error) {
            // Only log once, not repeatedly
            if (roomInfoActive) {
                console.error('Failed to load room info:', error);
            }
            // Check if room is closed
            if (error.message && error.message.includes('not found')) {
                // Stop future room info fetches
                roomInfoActive = false;
                if (roomInfoInterval) {
                    clearInterval(roomInfoInterval);
                    roomInfoInterval = null;
                }
                if (typeof chat !== 'undefined' && chat.handleRoomClosed) {
                    chat.handleRoomClosed();
                }
            }
        }
    }

    loadRoomInfo();
    // Refresh room info every 10 seconds
    roomInfoInterval = setInterval(loadRoomInfo, 10000);

    // Leave Room
    document.getElementById('leaveRoomBtn').addEventListener('click', () => {
        document.getElementById('leaveModal').style.display = 'flex';
    });

    document.getElementById('cancelLeave').addEventListener('click', () => {
        document.getElementById('leaveModal').style.display = 'none';
    });

    document.getElementById('confirmLeave').addEventListener('click', async () => {
        try {
            // Stop polling first
            if (typeof polling !== 'undefined') {
                polling.stopPolling();
            }
            
            await api.post('/rooms/leave', {
                roomCode: roomCode,
                userId: userId
            });
            
            // Clear local storage
            if (typeof chat !== 'undefined' && chat.cleanup) {
                chat.cleanup();
            } else {
                localStorage.removeItem('roomCode');
                localStorage.removeItem('roomName');
                localStorage.removeItem('userId');
                localStorage.removeItem('userName');
                localStorage.removeItem('isCreator');
                localStorage.removeItem('joinTime');
                localStorage.removeItem('lastMessageTime');
            }
            
            window.location.href = 'index.html';
        } catch (error) {
            alert('Failed to leave room: ' + error.message);
        }
    });
</script>
</body>
</html>
