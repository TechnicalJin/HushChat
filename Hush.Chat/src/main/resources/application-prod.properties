# ===============================
# PRODUCTION CONFIGURATION
# ===============================
# This file contains production-specific settings.
# To use this profile, run with: --spring.profiles.active=prod
# or set environment variable: SPRING_PROFILES_ACTIVE=prod

# ===============================
# Server Configuration
# ===============================
server.port=8080
server.shutdown=graceful

# Enable compression for better performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ===============================
# Spring Configuration
# ===============================
spring.application.name=chat-backend

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ===============================
# Hush Chat Configuration
# ===============================

# OTP
hush.otp.length=6
hush.otp.expiry-minutes=3
hush.otp.max-retries=3

# Session
hush.session.expiry-hours=24

# Messages
hush.message.ttl-minutes=10

# Room
hush.room.code-length=5
hush.room.max-users=10
hush.room.inactivity-timeout-minutes=30

# File Upload
hush.file.upload-dir=./uploads
hush.file.max-size-mb=200
hush.file.allowed-types=jpg,jpeg,png,pdf,txt,docx,xlsx

# Cleanup
hush.cleanup.interval-seconds=30

# Rate Limiting
hush.rate-limit.otp-per-hour=5
hush.rate-limit.messages-per-minute=30
hush.rate-limit.files-per-hour=10

# Polling
hush.polling.interval-seconds=2

# ===============================
# JWT Configuration - PRODUCTION
# ===============================
# IMPORTANT: Replace this secret with a secure random 256-bit key!
# Generate using: openssl rand -base64 32
# Or use environment variable: JWT_SECRET
jwt.secret=${JWT_SECRET:CHANGE-THIS-TO-A-SECURE-RANDOM-256-BIT-KEY-IN-PRODUCTION}
# JWT token expiration time in milliseconds (7 days)
jwt.expiration=604800000

# ===============================
# Database Configuration - PRODUCTION
# ===============================
# MySQL datasource - use environment variables for credentials
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chatdb?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate - PRODUCTION
# ===============================
# DDL auto mode - VALIDATE only (never modify schema in production!)
# Schema changes should be managed via Flyway or Liquibase
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL logging in production
spring.jpa.show-sql=false

# MySQL 8 dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Set timezone for JDBC connection
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Enable second-level cache (optional, uncomment if using)
# spring.jpa.properties.hibernate.cache.use_second_level_cache=true
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# ===============================
# HikariCP Connection Pool - PRODUCTION
# ===============================
# Larger pool for production workload
spring.datasource.hikari.maximum-pool-size=20

# Higher minimum idle connections
spring.datasource.hikari.minimum-idle=10

# Connection timeout
spring.datasource.hikari.connection-timeout=30000

# Maximum lifetime of a connection (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# Idle timeout (10 minutes)
spring.datasource.hikari.idle-timeout=600000

# Connection pool name
spring.datasource.hikari.pool-name=HushChatHikariPool-Prod

# Connection test query
spring.datasource.hikari.connection-test-query=SELECT 1

# Leak detection threshold (for debugging connection leaks)
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# Security Configuration
# ===============================
# Disable default Spring Security password logging
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:changeme}

# ===============================
# Logging - PRODUCTION
# ===============================
# Application logging - INFO level for production
logging.level.com.code.HushChat=INFO
logging.level.root=WARN

# Spring Security logging - WARN level for production (not DEBUG!)
logging.level.org.springframework.security=WARN

# File-based logging for production
logging.file.name=logs/hush-chat.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# Actuator / Management - PRODUCTION
# ===============================
# Restrict actuator endpoints in production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# Health check details
management.health.diskspace.enabled=true
management.health.db.enabled=false

# ===============================
# Performance & Production Settings
# ===============================
# Disable DevTools in production
spring.devtools.restart.enabled=false

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ===============================
# NOTES FOR DEPLOYMENT
# ===============================
# 1. Set JWT_SECRET environment variable with a secure random key
#    Example: export JWT_SECRET=$(openssl rand -base64 32)
#
# 2. Configure proper CORS settings in CorsConfig.java for your domain
#
# 3. Use HTTPS in production (configure SSL certificates)
#
# 4. Set up proper logging aggregation (ELK, Splunk, etc.)
#
# 5. Configure database connection pool if using database
#
# 6. Set up monitoring and alerting (Prometheus, Grafana, etc.)
#
# 7. Review and adjust rate limiting based on your requirements
#
# 8. Consider using external configuration management (Vault, AWS Secrets Manager)
