# ===============================
# PRODUCTION CONFIGURATION
# ===============================
# This file contains production-specific settings.
# To use this profile, run with: --spring.profiles.active=prod
# or set environment variable: SPRING_PROFILES_ACTIVE=prod

# ===============================
# Server Configuration
# ===============================
server.port=8080
server.shutdown=graceful

# Enable compression for better performance
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ===============================
# Spring Configuration
# ===============================
spring.application.name=chat-backend

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ===============================
# Hush Chat Configuration
# ===============================

# OTP
hush.otp.length=6
hush.otp.expiry-minutes=3
hush.otp.max-retries=3

# Session
hush.session.expiry-hours=24

# Messages
hush.message.ttl-minutes=10

# Room
hush.room.code-length=5
hush.room.max-users=10
hush.room.inactivity-timeout-minutes=30

# File Upload
hush.file.upload-dir=./uploads
hush.file.max-size-mb=200
hush.file.allowed-types=jpg,jpeg,png,pdf,txt,docx,xlsx

# Cleanup
hush.cleanup.interval-seconds=30

# Rate Limiting
hush.rate-limit.otp-per-hour=5
hush.rate-limit.messages-per-minute=30
hush.rate-limit.files-per-hour=10

# Polling
hush.polling.interval-seconds=2

# ===============================
# JWT Configuration - PRODUCTION
# ===============================
# SECURITY FIX #9A: No insecure fallback. The APP_JWT_SECRET environment variable
# MUST be set before the application starts. Startup will fail with a clear error
# if it is missing, preventing deployment with the default development secret.
app.jwt-secret=${APP_JWT_SECRET}
# JWT token expiration time in milliseconds (1 day)
app.jwt-expiration-milliseconds=86400000
# JWT issuer claim for newly generated tokens
hush.jwt.issuer=hush-chat

# ===============================
# CORS - PRODUCTION
# ===============================
# No wildcard or localhost fallback for production. Must be supplied via the
# CORS_ALLOWED_ORIGINS environment variable (e.g. https://app.example.com).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


# ===============================
# Database Configuration - PRODUCTION
# ===============================
# MySQL datasource - required environment variables, no insecure fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chatdb?useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate - PRODUCTION
# ===============================
# DDL auto mode - VALIDATE only (never modify schema in production!)
# Schema changes should be managed via Flyway or Liquibase
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL logging in production
spring.jpa.show-sql=false

# MySQL 8 dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Set timezone for JDBC connection
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Enable second-level cache (optional, uncomment if using)
# spring.jpa.properties.hibernate.cache.use_second_level_cache=true
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# ===============================
# HikariCP Connection Pool - PRODUCTION
# ===============================
# Larger pool for production workload
spring.datasource.hikari.maximum-pool-size=20

# Higher minimum idle connections
spring.datasource.hikari.minimum-idle=10

# Connection timeout
spring.datasource.hikari.connection-timeout=30000

# Maximum lifetime of a connection (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# Idle timeout (10 minutes)
spring.datasource.hikari.idle-timeout=600000

# Connection pool name
spring.datasource.hikari.pool-name=HushChatHikariPool-Prod

# Connection test query
spring.datasource.hikari.connection-test-query=SELECT 1

# Leak detection threshold (for debugging connection leaks)
spring.datasource.hikari.leak-detection-threshold=60000

# ===============================
# Redis Configuration - PRODUCTION
# ===============================
# Production Redis (Docker/Cloud) - use environment variables
# SECURITY FIX #9A: REDIS_HOST, REDIS_PORT, and REDIS_PASSWORD are mandatory
# environment variables in production. Startup fails fast if they are missing.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=5000ms
spring.data.redis.client-type=lettuce

# Production connection pool settings (larger for high load)
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4
spring.data.redis.lettuce.pool.max-wait=3000ms

# Redis database index
spring.data.redis.database=0

# ===============================
# Room Code Settings - PRODUCTION
# ===============================
app.room.code.ttl=3600
app.room.code.length=6
app.room.code.max-retries=5

# ===============================
# Logging - PRODUCTION
# ===============================
# Application logging - INFO level for production
logging.level.com.code.HushChat=INFO
logging.level.root=WARN

# Spring Security logging - WARN level for production (not DEBUG!)
logging.level.org.springframework.security=WARN

# File-based logging for production
logging.file.name=logs/hush-chat.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# Actuator / Management - PRODUCTION
# ===============================
# SECURITY FIX #9D: Restrict actuator endpoints in production.
# Only health and info are exposed; env, configprops, and metrics are hidden.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# SECURITY FIX #9D: Explicitly disable sensitive actuator endpoints
# (defense-in-depth even if exposure config is overridden).
management.endpoint.env.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.mappings.enabled=false
management.endpoint.loggers.enabled=false
management.endpoint.threaddump.enabled=false
management.endpoint.heapdump.enabled=false

# Health check details
management.health.diskspace.enabled=true
management.health.db.enabled=false

# ===============================
# Performance & Production Settings
# ===============================
# Disable DevTools in production
spring.devtools.restart.enabled=false

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ===============================
# NOTES FOR DEPLOYMENT
# ===============================
# SECURITY FIX #9A: The following environment variables are MANDATORY for
# production. The application will NOT start without them.
#
# Required environment variables:
#   APP_JWT_SECRET    - 256-bit (32-byte) hex-encoded HMAC secret for JWT signing
#   DB_URL            - JDBC URL for MySQL (e.g. jdbc:mysql://host:3306/chatdb?useSSL=true)
#   DB_USERNAME       - MySQL username
#   DB_PASSWORD       - MySQL password
#   REDIS_HOST        - Redis hostname (e.g. redis.internal)
#   REDIS_PORT        - Redis port (e.g. 6379)
#   REDIS_PASSWORD    - Redis authentication password
#   CORS_ALLOWED_ORIGINS - Comma-separated allowed origins (e.g. https://app.example.com)
#
# Optional environment variables:
#   REDIS_SSL         - Enable Redis SSL (default: false)
#
# Generate a secure JWT secret:
#   export APP_JWT_SECRET=$(openssl rand -hex 32)
#
# NEVER commit secrets to version control. Use a secrets manager
# (Vault, AWS Secrets Manager, Azure Key Vault, etc.) in production.
