# ===============================
# Server Configuration
# ===============================
server.port=8080
server.shutdown=graceful

# ===============================
# Spring Configuration
# ===============================
spring.application.name=hush-chat

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ===============================
# Hush Chat Configuration
# ===============================

# OTP
hush.otp.length=6
hush.otp.expiry-minutes=3
hush.otp.max-retries=3

# Session
hush.session.expiry-hours=24

# Messages
hush.message.ttl-minutes=10

# Room
hush.room.code-length=5
hush.room.max-users=10
hush.room.inactivity-timeout-minutes=30

# File Upload
hush.file.upload-dir=./uploads
hush.file.max-size-mb=200
hush.file.allowed-types=jpg,jpeg,png,gif,webp,bmp,ico,svg,pdf,txt,doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,rtf,csv,json,xml,html,css,js,ts,java,py,c,cpp,h,hpp,cs,go,rs,rb,php,sql,sh,bat,ps1,md,yaml,yml,ini,cfg,conf,log,zip,rar,7z,tar,gz,bz2,xz,mp3,mp4,mov,avi,mkv,webm,wav,flac,ogg,aac,m4a,wma

# Cleanup
hush.cleanup.interval-seconds=30

# Rate Limiting
hush.rate-limit.otp-per-hour=5
hush.rate-limit.messages-per-minute=30
hush.rate-limit.files-per-hour=10

# Polling
hush.polling.interval-seconds=2

# ===============================
# Logging
# ===============================
logging.level.com.hushchat=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# Actuator / Management
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
