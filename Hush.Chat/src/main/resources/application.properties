# ===============================
# Server Configuration
# ===============================
server.port=8080
server.shutdown=graceful

# ===============================
# Spring Configuration
# ===============================
spring.application.name=chat-backend

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ===============================
# Hush Chat Configuration
# ===============================

# OTP
hush.otp.length=6
hush.otp.expiry-minutes=3
hush.otp.max-retries=3

# Session
hush.session.expiry-hours=24

# Messages
hush.message.ttl-minutes=10

# Room
hush.room.code-length=5
hush.room.max-users=10
hush.room.inactivity-timeout-minutes=30

# File Upload
hush.file.upload-dir=./uploads
hush.file.max-size-mb=200
hush.file.allowed-types=jpg,jpeg,png,pdf,txt,docx,xlsx

# Cleanup
hush.cleanup.interval-seconds=30

# Rate Limiting
hush.rate-limit.otp-per-hour=5
hush.rate-limit.messages-per-minute=30
hush.rate-limit.files-per-hour=10

# Polling
hush.polling.interval-seconds=2

# ===============================
# JWT Configuration
# ===============================
# Secret key for JWT token signing (change in production!)
jwt.secret=your-256-bit-secret-key-change-in-production-must-be-at-least-256-bits
# JWT token expiration time in milliseconds (7 days)
jwt.expiration=604800000

# ===============================
# Database Configuration - MySQL
# ===============================
# MySQL datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/chatdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Varun@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
# DDL auto mode - 'update' for development (creates/updates tables automatically)
# WARNING: Use 'validate' or 'none' in production!
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (development only)
spring.jpa.show-sql=true

# Format SQL output for readability
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8 dialect for optimal query generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Set timezone for JDBC connection
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# HikariCP Connection Pool
# ===============================
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections
spring.datasource.hikari.minimum-idle=5

# Connection timeout in milliseconds
spring.datasource.hikari.connection-timeout=20000

# Maximum lifetime of a connection in milliseconds (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# Connection pool name for logging
spring.datasource.hikari.pool-name=HushChatHikariPool

# ===============================
# Logging
# ===============================
# Application logging
logging.level.com.code.HushChat=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Spring Security logging (DEBUG for development)
logging.level.org.springframework.security=DEBUG

# ===============================
# Actuator / Management
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
