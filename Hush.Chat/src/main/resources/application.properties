# ===============================
# Server Configuration
# ===============================
server.port=8080
server.shutdown=graceful

# ===============================
# Spring Configuration
# ===============================
spring.application.name=chat-backend

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# ===============================
# Hush Chat Configuration
# ===============================

# OTP
hush.otp.length=6
hush.otp.expiry-minutes=3
hush.otp.max-retries=3

# Session
hush.session.expiry-hours=24

# Messages
hush.message.ttl-minutes=10

# Room
hush.room.code-length=5
hush.room.max-users=10
hush.room.inactivity-timeout-minutes=30

# File Upload
hush.file.upload-dir=./uploads
hush.file.max-size-mb=200
hush.file.allowed-types=jpg,jpeg,png,pdf,txt,docx,xlsx

# Cleanup
hush.cleanup.interval-seconds=30

# Rate Limiting
hush.rate-limit.otp-per-hour=5
hush.rate-limit.messages-per-minute=30
hush.rate-limit.files-per-hour=10

# JWT Configuration (Reference Implementation)
app.jwt-secret=daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb
app.jwt-expiration-milliseconds=86400000

# ===============================
# Database Configuration - MySQL
# ===============================
# MySQL datasource configuration (using local MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/chatdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Varun@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
# DDL auto mode - 'update' for development (creates/updates tables automatically)
# WARNING: Use 'validate' or 'none' in production!
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console (development only)
spring.jpa.show-sql=false

# Format SQL output for readability
spring.jpa.properties.hibernate.format_sql=false

# MySQL 8 dialect for optimal query generation
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Set timezone for JDBC connection
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Disable open-in-view warning
spring.jpa.open-in-view=false

# ===============================
# HikariCP Connection Pool
# ===============================
# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections
spring.datasource.hikari.minimum-idle=5

# Connection timeout in milliseconds
spring.datasource.hikari.connection-timeout=20000

# Maximum lifetime of a connection in milliseconds (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# Connection pool name for logging
spring.datasource.hikari.pool-name=HushChatHikariPool

# ===============================
# Redis Configuration (Docker)
# ===============================
# Redis host (localhost when using Docker)
spring.data.redis.host=localhost

# Redis port (default 6379)
spring.data.redis.port=6379

# Redis password (empty for development)
spring.data.redis.password=

# Connection timeout
spring.data.redis.timeout=2000ms

# Redis client type (lettuce - default, high performance)
spring.data.redis.client-type=lettuce

# Lettuce connection pool settings
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# Redis database index (0-15)
spring.data.redis.database=0

# ===============================
# Room Code Settings (Redis-based)
# ===============================
# Room code TTL in seconds (1 hour)
app.room.code.ttl=3600

# Room code length
app.room.code.length=6

# Maximum retries for code generation
app.room.code.max-retries=5

# ===============================
# Logging
# ===============================
# Application logging
logging.level.com.code.HushChat=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Spring Security logging - WARN to reduce noise (only show important issues)
logging.level.org.springframework.security=WARN

# Disable Spring Boot startup banner noise
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.redis=WARN

# Hibernate logging - ERROR only
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

# ===============================
# Actuator / Management
# ===============================
# Expose health and info endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Show detailed health information (always in dev)
management.endpoint.health.show-details=always

# Enable Redis health check
management.health.redis.enabled=true

# CORS for WebSocket
# NOTE: realtime.mode property removed - WebSocket is now the ONLY transport
cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080