# ===============================
# TEST CONFIGURATION
# ===============================
# Test datasource uses an in-memory H2 database so @SpringBootTest
# (ApplicationTests) can start without requiring the developer's
# MySQL credentials.

spring.datasource.url=jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# JWT Configuration - TEST ONLY
# ===============================
# Dedicated test-only placeholder secret (not a production value).
# Required because the test application.properties shadows the main one,
# so JwtTokenProvider's canonical app.jwt-secret must be supplied here for
# the Spring context to load.
# 64 hex chars = 32 bytes = 256 bits (sufficient for HS256).
app.jwt-secret=1b387c484213ab0f9e0cd8d42385b3a07494b6eac8fc015a9428df27173df4d9
app.jwt-expiration-milliseconds=3600000
# JWT issuer claim for newly generated tokens
hush.jwt.issuer=hush-chat

# ===============================
# CORS Configuration - TEST ONLY
# ===============================
# Required by CorsConfig and WebSocketConfig (@Value injection)
cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080
