<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Hush.Chat</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="container">
    <header class="header">
        <div class="logo">
            <span class="lock-icon">🔐</span>
            <h1>Hush.Chat</h1>
        </div>
    </header>

    <main class="main-content">
        <div class="card">
            <h2>Verify OTP</h2>
            <p class="description">
                Enter the 6-digit OTP code
            </p>

            <div class="device-info">
                <strong>Device ID:</strong> <span id="deviceIdDisplay"></span>
            </div>

            <form id="otpVerifyForm" class="auth-form">
                <div class="form-group">
                    <label for="otpCode">OTP Code</label>
                    <input
                            type="text"
                            id="otpCode"
                            name="otpCode"
                            placeholder="000000"
                            pattern="[0-9]{6}"
                            maxlength="6"
                            required
                            autocomplete="off"
                    >
                    <small class="help-text" id="otpHelp">
                        Enter the 6-digit code. <span id="retriesLeft"></span>
                    </small>
                </div>

                <button type="submit" class="btn btn-primary" id="verifyOtpBtn">
                    Verify OTP
                </button>
            </form>

            <div class="alternative-actions">
                <button type="button" class="btn-link" id="requestNewOtp">
                    Request New OTP
                </button>
                <a href="index.html" class="btn-link">Back to Login</a>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>
        </div>

        <div class="info-box">
            <div class="timer-section">
                <span class="icon">⏱️</span>
                <span>OTP expires in: <strong id="countdown">3:00</strong></span>
            </div>
            <p class="small-text">
                For testing: Check the console logs for the OTP code
            </p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Hush.Chat - Privacy-First Messaging</p>
    </footer>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>

<script>
    // Initialize OTP verification page
    const deviceId = localStorage.getItem('deviceId');

    if (!deviceId) {
        showError('No device ID found. Redirecting to login...');
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    } else {
        document.getElementById('deviceIdDisplay').textContent = deviceId;

        // Start countdown timer
        let timeLeft = 180; // 3 minutes in seconds
        const countdownElement = document.getElementById('countdown');

        const countdownInterval = setInterval(() => {
            timeLeft--;
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                showError('OTP has expired. Please request a new one.');
                document.getElementById('verifyOtpBtn').disabled = true;
            }
        }, 1000);
    }

    // Handle OTP verification
    document.getElementById('otpVerifyForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const otpCode = document.getElementById('otpCode').value;
        const verifyBtn = document.getElementById('verifyOtpBtn');

        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Verifying...';

        try {
            const response = await api.post('/auth/verify-otp', {
                deviceId: deviceId,
                otp: otpCode
            });

            if (response.success) {
                // Store session token
                localStorage.setItem('sessionToken', response.data.sessionToken);
                localStorage.setItem('userId', response.data.userId);

                showSuccess('OTP verified! Redirecting...');

                setTimeout(() => {
                    window.location.href = 'chat.html';
                }, 1500);
            } else {
                throw new Error(response.error || 'Verification failed');
            }
        } catch (error) {
            showError(error.message || 'Failed to verify OTP');
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'Verify OTP';
        }
    });

    // Handle request new OTP
    document.getElementById('requestNewOtp').addEventListener('click', async () => {
        const btn = document.getElementById('requestNewOtp');
        btn.disabled = true;
        btn.textContent = 'Requesting...';

        try {
            await api.post('/auth/request-otp', { deviceId });
            showSuccess('New OTP sent successfully!');

            // Reset countdown
            location.reload();
        } catch (error) {
            showError(error.message || 'Failed to request new OTP');
            btn.disabled = false;
            btn.textContent = 'Request New OTP';
        }
    });
</script>
</body>
</html>
